# Every npm manifest in this repo is a workspace member, so the root
# pnpm-lock.yaml is the ONE lockfile and Dependabot's single `/` entry keeps
# all of them consistent. Do not remove a member to give it a private
# lockfile: Dependabot cannot update a member manifest and the root lockfile
# from a per-directory entry, so the member's PRs are then born either
# unmergeable (workspace member, root lockfile untouched) or silently drifted
# (standalone, its own lockfile untouched). Both failure modes have happened
# here — see the rev-3 note in .github/dependabot.yml.
packages:
  - 'server/mcp'
  - 'server/content'
  - 'website'

# Minutes. pnpm refuses to RESOLVE a version published less than a week ago,
# so a compromised release of a package already in the tree has time to be
# noticed and unpublished before it can enter the lockfile. This is a different
# threat from the one scripts/check-new-deps.sh covers (a package NAME that is
# new, checked at 30 days): a 30-day wait here would also hold back a security
# fix for a month. Installing from the lockfile (`--frozen-lockfile`) resolves
# nothing, so CI is unaffected.
#
# The npm `cooldown` in .github/dependabot.yml must be at least this long, or
# Dependabot proposes versions pnpm will not resolve. If a fix is needed
# sooner, list the package in `minimumReleaseAgeExclude` for that one change
# and remove it afterwards; scripts/check-supply-chain-pins.test.mjs fails
# while an exclusion is present.
minimumReleaseAge: 10080
